[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cqlib-pulse"
version = "0.3.0"
description = "Pulse-level circuit construction and Tianyan cloud integration for CQLib"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "China Telecom Quantum Group Quantum Computing Team", email = "tianyan@chinatelecom.cn" },
]
keywords = ["cqlib", "quantum computing", "pulse", "QCIS", "Tianyan"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "cqlib>=0.1.0,<2",
]

[project.optional-dependencies]
# Cloud support is optional so local circuit/QCIS use remains lightweight.
tianyan = ["cqlib-tianyan>=0.1.0,<1"]
test = ["pytest>=8"]
build = ["build>=1.2", "twine>=5"]

[project.urls]
Repository = "https://github.com/cq-lib/cqlib-pulse"
Issues = "https://github.com/cq-lib/cqlib-pulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cqlib_pulse = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
